name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

jobs:
  analyze:
    name: CodeQL (c-cpp)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake and Ninja
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --upgrade cmake ninja
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
