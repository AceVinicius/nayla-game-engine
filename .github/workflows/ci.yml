name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only PRs (docs/, *.md) skip the build steps. The jobs still run, so every
  # required matrix check reports success. Any doubt (push, diff error) builds.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ] && files="$(git diff --name-only --no-renames "origin/$BASE...HEAD")" \
             && [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build-test:
    needs: changes
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v7

      # The project requires a recent CMake (see CMakeLists.txt).
      - name: Install CMake and Ninja
        if: needs.changes.outputs.code == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --upgrade cmake ninja
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      # Linux backend build dependencies (ADR-012 follow-up 2): pkg-config finds
      # x11, wayland-client and libdecor-0; wayland-scanner (libwayland-bin) and
      # wayland-protocols supply the protocol glue. macOS needs none of these.
      - name: Install Linux backend dependencies
        if: needs.changes.outputs.code == 'true' && startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libwayland-dev libwayland-bin wayland-protocols libdecor-0-dev xvfb x11-utils

      # Display server (ADR-012 Decision 5, PLATFORM-101): window conformance needs
      # one, so Xvfb runs and no job declares a headless host. Tests start only
      # after the X display answers.
      - name: Start Xvfb
        if: needs.changes.outputs.code == 'true' && startsWith(matrix.os, 'ubuntu')
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for _ in $(seq 50); do
            DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && exit 0
            sleep 0.1
          done
          echo "Xvfb did not come up on :99" >&2
          exit 1

      # Warnings are errors: the project's bar is zero warnings.
      - name: Configure
        if: needs.changes.outputs.code == 'true'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: cmake --build build

      # Includes the architecture tests (no OS/GPU includes, no globals, ...).
      # No job declares a headless host (PLATFORM-101): contract/platform_window
      # must run, so a missing window session fails it. Ubuntu runs it against
      # Xvfb with automatic selection. The -V line prints the test's output.
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: |
          ctest --test-dir build -R contract/platform_window -V
          ctest --test-dir build --output-on-failure

  # Catches what warnings cannot: out-of-bounds, misaligned access, signed
  # overflow, leaks (the allocator does pointer/alignment arithmetic).
  sanitizers:
    name: sanitizers (ubuntu)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake and Ninja
        if: needs.changes.outputs.code == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --upgrade cmake ninja
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      # Linux backend build dependencies (ADR-012 follow-up 2); see build-test.
      - name: Install Linux backend dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libwayland-dev libwayland-bin wayland-protocols libdecor-0-dev xvfb x11-utils

      # Display server (ADR-012 Decision 5, PLATFORM-101): window conformance needs
      # one, so Xvfb runs and no job declares a headless host. Tests start only
      # after the X display answers.
      - name: Start Xvfb
        if: needs.changes.outputs.code == 'true'
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for _ in $(seq 50); do
            DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && exit 0
            sleep 0.1
          done
          echo "Xvfb did not come up on :99" >&2
          exit 1

      - name: Configure
        if: needs.changes.outputs.code == 'true'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: cmake --build build

      # x11 forced (ADR-012 Decision 5): the window suite runs on the X11 path under
      # Xvfb, and a forced system whose server is down is a FAIL (PLATFORM-092).
      - name: Test
        if: needs.changes.outputs.code == 'true'
        env:
          NAYLA_LINUX_WINDOW_SYSTEM: x11
        run: |
          ctest --test-dir build -R contract/platform_window -V
          ctest --test-dir build --output-on-failure
