name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      # The project requires a recent CMake (see CMakeLists.txt).
      - name: Install CMake and Ninja
        run: python3 -m pip install --user --upgrade cmake ninja && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Warnings are errors: the project's bar is zero warnings.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      # Includes the architecture tests (no OS/GPU includes, no globals, ...).
      - name: Test
        run: ctest --test-dir build --output-on-failure
