name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v7

      # The project requires a recent CMake (see CMakeLists.txt).
      - name: Install CMake and Ninja
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --upgrade cmake ninja
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      # Warnings are errors: the project's bar is zero warnings.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      # Includes the architecture tests (no OS/GPU includes, no globals, ...).
      # The Ubuntu job declares a headless host (PLATFORM-101): contract/platform_window
      # skips there. The macOS job does not, so a missing window session fails it.
      - name: Test (headless declared)
        if: startsWith(matrix.os, 'ubuntu')
        env:
          NAYLA_TEST_NO_DISPLAY: "1"
        run: ctest --test-dir build --output-on-failure

      - name: Test
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: ctest --test-dir build --output-on-failure

  # Catches what warnings cannot: out-of-bounds, misaligned access, signed
  # overflow, leaks (the allocator does pointer/alignment arithmetic).
  sanitizers:
    name: sanitizers (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake and Ninja
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --upgrade cmake ninja
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build

      # Headless declared (PLATFORM-101): this job runs on ubuntu-latest.
      - name: Test
        env:
          NAYLA_TEST_NO_DISPLAY: "1"
        run: ctest --test-dir build --output-on-failure
